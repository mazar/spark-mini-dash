<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DGX Spark · spark-mini-dash</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header>
  <h1>Nodes</h1>
  <div id="online" class="pill" hidden><svg class="glyph" viewBox="0 0 12 12"><circle cx="6" cy="6" r="4"/></svg><span id="online-text">…</span></div>
  <div class="meta">
    <button id="view-toggle" type="button" aria-pressed="false" title="Toggle table view (T)">Table <kbd>T</kbd></button>
    <span id="clock"></span>
    <span id="poll">poll …</span>
    <span id="stamp"></span>
  </div>
</header>

<main id="stage">
  <section id="metrics" aria-label="Node metric strips"></section>
  <section id="flow" aria-label="PAIR request flow">
    <div id="pair-head">
      <h2>Request flow</h2>
      <div id="pair-status" role="status"></div>
    </div>
    <div id="flow-viz">
      <canvas id="flow-canvas"></canvas>
    </div>
  </section>
</main>

<section id="tableview" hidden aria-label="Node table view">
  <table>
    <caption>Live node telemetry — same data as the panel view</caption>
    <thead><tr id="tv-head"></tr></thead>
    <tbody id="tv-body"></tbody>
  </table>
</section>

<div id="tooltip" role="status" hidden></div>
<script src="/js/app.js"></script>
</body>
</html>
